# IntelliJ Platform Artifacts Repositories
# -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html
pluginGroup=nl.utwente.jmlplugin
pluginName_=IntelliJML
pluginVersion=1.1.10
pluginSinceBuild=251
pluginUntilBuild=263.*
# IntelliJ IDEA versions to check with the Plugin Verifier (./gradlew verifyPlugin)
# See https://jb.gg/intellij-platform-builds-list for available build versions
pluginVerifierIdeVersions=2025.1.7, 2025.2.6, 2025.3.6, 2026.1.5, 2026.2.4
# IntelliJ IDEA version to build and test against
platformVersion=2026.2.4
# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# Only used during development (e.g. runIde), not required by the plugin at runtime
platformPlugins=PsiViewer:2026.2
# Keep the Ultimate plugin off the test classpath: its obfuscated classes clash with platform classes there
# (fails every fixture test with "Cannot create extension (class=Q.Q.Q.Q.V)"). Fixed upstream after
# IntelliJ Platform Gradle Plugin 2.19.0, see JetBrains/intellij-platform-gradle-plugin#2261
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes=com.intellij.openRewrite,com.intellij.modules.ultimate
# Bytecode level of the plugin: the Java version of the oldest supported platform (2025.x runs on Java 21)
javaVersion=21
# JDK used to compile and run tests: the Java version of platformVersion (2026.x is built for Java 25)
javaToolchainVersion=25
gradleVersion=9.8.2
